<svg width="200" height="40" viewBox="0 0 200 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- IBM Blue 60 wordmark: "AMQ Broker" -->
  <rect width="200" height="40" fill="white"/>
  <!-- IBM 8-bar logo mark (simplified) -->
  <rect x="4"  y="8"  width="24" height="3" fill="#0f62fe"/>
  <rect x="4"  y="13" width="24" height="3" fill="#0f62fe"/>
  <rect x="4"  y="18" width="10" height="3" fill="#0f62fe"/>
  <rect x="18" y="18" width="10" height="3" fill="#0f62fe"/>
  <rect x="4"  y="23" width="10" height="3" fill="#0f62fe"/>
  <rect x="18" y="23" width="10" height="3" fill="#0f62fe"/>
  <rect x="4"  y="28" width="24" height="3" fill="#0f62fe"/>
  <!-- Divider -->
  <rect x="36" y="8" width="1" height="24" fill="#e0e0e0"/>
  <!-- Text label -->
  <text x="44" y="26"
        font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif"
        font-size="15"
        font-weight="500"
        fill="#161616"
        letter-spacing="0.5">AMQ Broker Ops</text>
</svg>
